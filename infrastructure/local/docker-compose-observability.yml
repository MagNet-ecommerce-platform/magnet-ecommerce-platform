services:

  # ============================================================
  # OpenTelemetry Collector
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    container_name: identity-otel-collector

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ../../observability/opentelemetry/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

    depends_on:
      - prometheus
      - tempo
      - loki

    networks:
      - local_default

    restart: unless-stopped

  # ============================================================
  # Alloy
  # ============================================================

  alloy:
    image: grafana/alloy:latest
    container_name: identity-alloy
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"
    volumes:
      - ../../observability/logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    networks:
      - local_default
    depends_on:
      - loki
    restart: unless-stopped
    
  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: identity-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - local_default

    restart: unless-stopped


  # ============================================================
  # Tempo
  # ============================================================
  tempo:
    image: grafana/tempo:2.8.3
    container_name: identity-tempo

    command:
      - "-config.file=/etc/tempo/tempo.yml"

    volumes:
      - ../../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

    ports:
      - "3200:3200"

    networks:
      - local_default

    restart: unless-stopped


  # ============================================================
  # Loki
  # ============================================================
  loki:
    image: grafana/loki:3.5.5
    container_name: identity-loki

    command:
      - "-config.file=/etc/loki/loki.yml"

    volumes:
      - ../../observability/logging/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

    ports:
      - "3100:3100"

    networks:
      - local_default

    restart: unless-stopped


  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:12.1.1
    container_name: identity-grafana

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus
      - tempo
      - loki

    networks:
      - local_default

    restart: unless-stopped


# ==============================================================
# Persistent volumes
# ==============================================================
volumes:

  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:


# ==============================================================
# Existing Docker network
# ==============================================================
networks:

  local_default:
    external: true