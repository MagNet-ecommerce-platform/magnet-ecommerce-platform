# Staging environment overrides for Identity Service.

replicaCount: 2

image:
  tag: "0.1.1"

env:
  springProfilesActive: staging

  identityDb:
    host: identity-postgres
    port: 5432
    name: identity_db
    user: identity_user

  kafka:
    bootstrapServers: kafka:9092

  jwt:
    accessTokenExpiration: "900000"
    refreshTokenExpiration: "604800000"

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi
