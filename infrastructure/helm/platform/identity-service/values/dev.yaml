# Development environment overrides for Identity Service.

replicaCount: 1

image:
  tag: "0.1.0"

env:
  springProfilesActive: dev

  identityDb:
    host: identity-postgres
    port: 5432
    name: identity_db
    user: identity_user

  kafka:
    bootstrapServers: kafka:9092

  jwt:
    accessTokenExpiration: "900000"
    refreshTokenExpiration: "604800000"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
