name: Security

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  dependency-check:
    name: Maven Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: services/identity-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache OWASP Dependency Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-
      - name: Verify Java version
        run: java -version

      - name: Run Maven dependency analysis
        run: mvn dependency:tree

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY is unavailable. Check repository secrets and workflow trigger."
            exit 1
          fi
          mvn org.owasp:dependency-check-maven:check \
            -DskipTests \
            -DnvdApiKey="$NVD_API_KEY" \
            -DsuppressionFiles="$GITHUB_WORKSPACE/services/identity-service/dependency-check-suppressions.xml" \
            -DfailBuildOnCVSS=7

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-service-dependency-check-report
          path: services/identity-service/target/dependency-check-report.html
          if-no-files-found: warn
          retention-days: 14
