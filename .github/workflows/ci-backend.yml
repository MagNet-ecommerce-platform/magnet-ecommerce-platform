name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-service-test:
    name: Identity Service - Test and Package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/identity-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/identity-service/pom.xml

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Test and package Identity Service
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-service-test-reports
          path: services/identity-service/target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packaged JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: identity-service-jar
          path: services/identity-service/target/identity-service-*.jar
          if-no-files-found: error
          retention-days: 14
