name: Docker Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-service-docker:
    name: Identity Service - Build and Publish Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: c8n.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build Identity Service Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/identity-service
          file: ./services/identity-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: c8n.io/eyob-09/identity-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
