spring:
  application:
    name: identity-service

server:
  port: 8081

logging:
  level:
    root: INFO
    "[com.magnet.ecommerce.identity-service]": DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  metrics:
    export:
      otlp:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true