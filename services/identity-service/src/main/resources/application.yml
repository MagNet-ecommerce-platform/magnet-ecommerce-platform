spring:
  application:
    name: identity-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8081

logging:
  level:
    root: INFO
    "[com.magnet.ecommerce.identity-service]": DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    export:
      otlp:
        enabled: false
