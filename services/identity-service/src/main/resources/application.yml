spring:

  kafka:

    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.magnet.ecommerce.identity_service.event
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://localhost:${IDENTITY_DB_PORT:5432}/${IDENTITY_DB_NAME:identity_db}
    username: ${IDENTITY_DB_USER:identity_user}
    password: ${IDENTITY_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8081

logging:
  level:
    root: INFO
    "[com.magnet.ecommerce.identity-service]": DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true

  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  show-actuator: true

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
